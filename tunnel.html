", "jeu": "14:00-17:00", "ven": "", "sam": "", "dim": ""}}}, "accompagnement": {"scope": "espace", "type": "vente", "nom": "Page de vente — Accompagnement co-NAÎTRE", "lieu": "en_ligne", "active": false, "titre": "Ton accompagnement co-NAÎTRE", "bandeau": "Pour toutes les mamans débordées", "intro": "Se réconcilier avec son corps, retrouver son énergie et sa confiance en soi, sans s'oublier en tant que maman.", "avantages": "Un plan alimentaire personnalisé — pour toute la famille\nUn programme sportif — adapté au rythme d'une maman\nUn programme de développement personnel — pour reprendre confiance en toi\nUn suivi par ta coach — et des outils d'accompagnement\nDe nouvelles habitudes — qui tiennent dans ton quotidien\nLe soutien de la communauté — des mamans qui avancent comme toi", "note": "Ton inscription se fait en 3 temps : tes coordonnées, la signature de ton contrat, puis le paiement sécurisé.", "faq": "", "apropos": "Je m'appelle Anaïs. Je suis coach, athlète et maman de trois enfants… et femme avant tout.\nJ'ai créé co-NAÎTRE pour aider les mamans à redevenir des femmes épanouies : parce qu'une maman épanouie, c'est une famille qui rayonne.", "merciTexte": "Ton paiement est bien reçu et ton contrat est signé. Bienvenue dans co-NAÎTRE ! Anaïs te contacte très vite pour démarrer.", "prestataire": "[À COMPLÉTER : nom, forme juridique, SIRET, adresse et e-mail de la Coach]", "mediateur": "[À COMPLÉTER : nom et coordonnées du médiateur de la consommation]", "contrat": "CONTRAT D'ACCOMPAGNEMENT co-NAÎTRE\n\nEntre les soussignés :\n{{prestataire}}\nci-après « la Coach »,\net {{nom}}, adresse e-mail {{email}}{{adresse}}, ci-après « la Cliente ».\n\nArticle 1 — Objet\nLe présent contrat a pour objet l'accompagnement de la Cliente par la Coach dans le cadre du programme « {{offre}} » : plan alimentaire personnalisé, programme sportif, programme de développement personnel, suivi par la Coach et outils d'accompagnement, tels que présentés sur la page de vente.\n\nArticle 2 — Durée\nL'accompagnement débute à la date de signature du présent contrat, sous réserve du paiement, pour la durée de la formule choisie.\n{{essai}}\n\nArticle 3 — Prix et paiement\nLe prix de la formule « {{offre}} » est de {{prix}} TTC. Le paiement s'effectue en ligne, de façon sécurisée, par l'intermédiaire de la plateforme Stripe, selon les modalités affichées avant la signature.\n\nArticle 4 — Droit de rétractation\nLa Cliente, consommatrice, dispose d'un délai de quatorze (14) jours à compter de la signature du contrat pour se rétracter, sans avoir à justifier de motif, en adressant sa décision à la Coach par e-mail. Si la Cliente demande expressément que l'accompagnement commence avant la fin de ce délai, elle devra payer un montant proportionnel à ce qui lui a été fourni jusqu'à la communication de sa décision de se rétracter.\n\nArticle 5 — Engagements de la Coach\nLa Coach s'engage à mettre en œuvre tous les moyens nécessaires à la bonne réalisation de l'accompagnement, avec sérieux et bienveillance. Il s'agit d'une obligation de moyens : aucun résultat chiffré n'est garanti, les résultats dépendant notamment de l'implication de la Cliente.\n\nArticle 6 — Engagements de la Cliente\nLa Cliente s'engage à fournir des informations exactes, à suivre les conseils dans la mesure de ses possibilités, et à prévenir la Coach de tout changement de sa situation.\n\nArticle 7 — Santé\nLa Cliente déclare ne connaître aucune contre-indication à la pratique d'une activité physique adaptée et s'engage à consulter son médecin en cas de doute, de grossesse, de pathologie ou de suites de grossesse. L'accompagnement ne remplace pas un avis médical.\n\nArticle 8 — Données personnelles\nLes données de la Cliente sont utilisées uniquement pour la gestion et le suivi de l'accompagnement. Elle peut exercer ses droits d'accès, de rectification et de suppression en écrivant à la Coach.\n\nArticle 9 — Propriété intellectuelle\nLes contenus (programmes, plans, supports) sont strictement personnels à la Cliente et ne peuvent être revendus ni diffusés.\n\nArticle 10 — Médiation de la consommation\nEn cas de litige, la Cliente peut recourir gratuitement à un médiateur de la consommation : {{mediateur}}\n\nArticle 11 — Droit applicable\nLe présent contrat est soumis au droit français.\n\nFait en ligne, le {{date}}.", "offres": {"n1": {"label": "Accompagnement — niveau 1", "detail": "", "prix": "249 €", "format": "aucun", "lien": "", "actif": true, "ordre": 1}, "n2_mensuel": {"label": "Accompagnement — niveau 2 (en mensualités)", "detail": "", "prix": "229 €/mois", "format": "aucun", "lien": "", "actif": true, "ordre": 2}, "n2_comptant": {"label": "Accompagnement — niveau 2 (comptant)", "detail": "", "prix": "2 257 €", "format": "aucun", "lien": "", "actif": true, "ordre": 3}}}};

          else h+='<div class="slot full"><div class="h">'+esc(s.heure)+'</div><div class="s">Complet</div></div>';
        });
        h+='</div>';
      });
      if(sl.length)h+='<button class="link" onclick="skipSlot()">'+(S.noSlot?'✓ ':'')+'Aucun créneau ne me convient — Anaïs me recontacte</button>';
    }
    var sc=need&&S.creneau&&CRENEAUX[S.creneau];
    h+='<div class="recap" style="margin-top:16px"><div><span>Formule</span><b>'+esc(o.label)+'</b></div>'+(sc?'<div><span>Premier cours</span><b>'+esc(fmtDate(sc.date))+' à '+esc(sc.heure)+'</b></div>':'')+'<div><span>Montant</span><b>'+esc(o.prix||'')+'</b></div></div>';

    h+='<div class="err" id="err"></div><button class="btn" onclick="finish()" '+((ready&&!S.busy)?'':'disabled')+'>'+(o.lien?'Valider et payer':'Valider ma demande')+'</button><button class="btn ghost" onclick="back()">Retour</button>';
  }
  h+='</div>'+foot();

}
function pick(id){S.offre=id;var o=offerById(id),sl=S.creneau&&CRENEAUX[S.creneau];if(sl&&!slotsFor(o).some(function(x){return x.id===S.creneau}))S.creneau='';S.noSlot=false;render()}
function pickSlot(id){S.creneau=id;S.noSlot=false;render()}
function skipSlot(){S.noSlot=!S.noSlot;if(S.noSlot)S.creneau='';render()}
function back(){S.step=Math.max(1,S.step-1);render();window.scrollTo(0,0)}
function showErr(m){var e=document.getElementById('err');if(e){e.textContent=m;e.style.display='block'}}
function next(){
  if(S.step===1){if(!S.offre)return;S.step=2;render();window.scrollTo(0,0);return}
  if(S.step===2){
    S.nom=document.getElementById('nom').value.trim();S.email=document.getElementById('email').value.trim();S.tel=document.getElementById('tel').value.trim();S.consent=document.getElementById('consent').checked;
    if(!S.nom)return showErr('Merci d\'indiquer ton nom et prénom.');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.email))return showErr('Cette adresse e-mail ne semble pas valide.');
    if(S.tel.replace(/\D/g,'').length<9)return showErr('Merci d\'indiquer un numéro de téléphone valide.');
    if(!S.consent)return showErr('Merci de cocher la case pour continuer.');
    saveLead('nouveau');
    S.step=3;render();window.scrollTo(0,0)
  }
}
function leadData(status){
  var o=offerById(S.offre)||{},sl=S.creneau&&CRENEAUX[S.creneau]||{};
  var d={funnel:FID,lieu:F.lieu||'desvres',nom:S.nom,email:S.email,telephone:S.tel,offreId:S.offre,offreLabel:o.label||'',offrePrix:o.prix||'',
    creneauId:S.creneau||'',creneauDate:sl.date||'',creneauHeure:sl.heure||'',status:status,updatedAt:new Date().toISOString(),
    source:Q.get('utm_source')||Q.get('src')||(document.referrer?'lien':'direct')};

function saveLead(status){
  if(!db)return;

    if(!S.leadId){S.leadId=db.ref('acquisition/leads').push().key;var d=leadData(status);d.createdAt=d.updatedAt;db.ref('acquisition/leads/'+S.leadId).set(d)}
    else db.ref('acquisition/leads/'+S.leadId).update(leadData(status));

}
function finish(){
  var o=offerById(S.offre);if(!o||S.busy)return;

  var status=o.lien?'paiement_ouvert':'nouveau';

    }
  },350);
}
function renderMerci(){
  if(F.type==='appel'||F.type==='vente')return eMerci();
  var rec=null;try{rec=JSON.parse(localStorage.getItem('sfm_tunnel_lead')||'null')}catch(e){}
  var first='';
  if(rec&&rec.id&&db){
    db.ref('acquisition/leads/'+rec.id).once('value').then(function(sn){
      var d=sn.val();if(!d)return;
      var now=new Date().toISOString();
      db.ref('acquisition/leads/'+rec.id).update({status:'paye',paidAt:now,updatedAt:now});
      db.ref('reservations/pendingValidations/'+rec.id).once('value').then(function(p){
        if(p.val())return;
        db.ref('reservations/pendingValidations/'+rec.id).set({nom:d.nom||'',email:d.email||'',telephone:d.telephone||'',lieu:d.lieu||'desvres',creneauId:d.creneauId||'',creneauDate:d.creneauDate||'',creneauHeure:d.creneauHeure||'',offre:d.offreLabel||'',montant:d.offrePrix||'',paiement:'paye',paidAt:now,source:'tunnel',leadId:rec.id,createdAt:now,status:'en_attente'});
      });
      try{localStorage.removeItem('sfm_tunnel_lead')}catch(e){}
      var el=document.getElementById('mprenom');if(el)el.textContent=(d.nom||'').split(' ')[0];
      tMail('paye',{leadId:rec.id,nom:d.nom,email:d.email,tel:d.telephone,offre:d.offreLabel,prix:d.offrePrix});
    });
  }

}
function init(){
  F=null;
  if(FID==='rituel'&&!FLYER)FLYER=RITUEL_IMG; // visuel par défaut (remplaçable depuis le tableau de bord)
  try{firebase.initializeApp(FB_CONFIG);db=firebase.database()}catch(e){}
  if(!Q.get('f')&&(Q.get('index')||location.protocol==='file:')){tIndex();return}
  var fallback=function(){F=DEFAULT_FUNNELS[FID]||DEFAULT_FUNNELS.desvres;if(F.type==='appel'||F.type==='vente'){eStart();return}render()};
  if(!db){fallback();return}
  db.ref('acquisition/funnels/'+FID).once('value').then(function(sn){
    F=sn.val()||DEFAULT_FUNNELS[FID]||DEFAULT_FUNNELS.desvres;
    // Le tunnel enregistré dans le tableau de bord n'a pas la page « challenge » : on reprend celle du tunnel (sans écraser ce qui est déjà réglé).
    try{var D0=DEFAULT_FUNNELS[FID];if(D0&&D0.challenge){F=Object.assign({},F);Object.keys(D0).forEach(function(k){if((k==='challenge'||/^ch[A-Z]/.test(k))&&F[k]===undefined)F[k]=D0[k]})}}catch(e){}
    if(F.type==='appel'||F.type==='vente'){eStart();return}
    if(Q.get('offre')&&offerById(Q.get('offre'))){S.offre=Q.get('offre')}
    // visite comptée une fois par session
    try{if(!sessionStorage.getItem('sfm_v_'+FID)&&!Q.get('apercu')&&!Q.get('merci')){sessionStorage.setItem('sfm_v_'+FID,'1');db.ref('acquisition/stats/'+FID+'/'+today()+'/vues').transaction(function(v){return (v||0)+1})}}catch(e){}
    render();
    // Code RECREDIT26 (frais d'adhésion offerts) : seulement pour une adhérente DÉJÀ inscrite — on vérifie que sa fiche existe.
    if(S.renew&&S.code){db.ref('reservations/clients/'+S.code.replace(/[.#$\/\[\]]/g,'')).once('value').then(function(s){var v=s.val();if(v&&(v.nom||v.email)){S.promo=true;if(!S.email&&v.email)S.email=v.email;if(!S.nom&&v.nom)S.nom=v.nom;render()}}).catch(function(){})}
    db.ref('acquisition/media/'+FID+'/flyer').once('value').then(function(s){var v=s.val();if(v&&v.dataUrl){FLYER=v.dataUrl;render()}}).catch(function(){});
    db.ref('reservations/creneaux').on('value',function(s){CRENEAUX=s.val()||{};if(S.step===3)render()});
  }).catch(fallback);
  setTimeout(function(){if(!F)fallback()},6000);
}

function eMeet(leadId,s,who){

      var c=m.val()||{};if(!c.url)return fb;
      var wait=new Promise(function(r){setTimeout(function(){r('')},7000)});
      var call=fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({secret:c.secret||'',leadId:leadId,titre:(F.rdvNom||'Bilan Forme Santé')+' avec Anaïs',nom:who.nom||ES.nom||'',email:who.email||ES.email||'',tel:who.tel||ES.tel||'',objectif:who.objectif||ES.objectif||'',date:s.date,heure:s.hm,duree:s.dur})})
        .then(function(r){return r.json()}).then(function(j){if(j&&j.ok&&j.meet){try{db.ref('acquisition/leads/'+leadId).update({meetLink:j.meet,meetEventId:j.eventId||null})}catch(e){}return j.meet}return ''}).catch(function(){return ''});

    });
  }).catch(function(){return fb});
}

  var A=F.agenda||{},dur=+A.duree||30,pas=+A.pas||dur,hor=+A.horizon||14,pre=(A.preavis==null?24:+A.preavis)*3600000,now=Date.now(),busy=[],booked=[];
  var pBusy=Promise.resolve();
  if(A.calendarId&&A.apiKey){
    var url='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(A.calendarId)+'/events?key='+encodeURIComponent(A.apiKey)+'&timeMin='+encodeURIComponent(new Date(now).toISOString())+'&timeMax='+encodeURIComponent(new Date(now+(hor+2)*86400000).toISOString())+'&singleEvents=true&orderBy=startTime&maxResults=250';
    pBusy=fetch(url).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){(j.items||[]).forEach(function(ev){if(ev.status==='cancelled'||ev.transparency==='transparent')return;var s=ev.start&&(ev.start.dateTime||ev.start.date),e=ev.end&&(ev.end.dateTime||ev.end.date);if(!s||!e)return;var a=ev.start.dateTime?Date.parse(s):parisTs(s,'00:00'),b=ev.end.dateTime?Date.parse(e):parisTs(e,'00:00');busy.push([a,b])})}).catch(function(){ES.calOk=false});
  }
  var pBook=db?db.ref('acquisition/appels').once('value').then(function(sn){var v=sn.val()||{};Object.keys(v).forEach(function(k){var m=k.match(/^(\d{4}-\d{2}-\d{2})_(\d{2})(\d{2})$/);if(m&&v[k]&&v[k].pending&&(Date.now()-Date.parse(v[k].at||0)>1800000))m=null;if(m){var a=parisTs(m[1],m[2]+':'+m[3]);booked.push([a,a+((v[k]&&v[k].dur)||dur)*60000])}})}).catch(function(){}):Promise.resolve();
  Promise.all([pBusy,pBook]).then(function(){
    var keys=['dim','lun','mar','mer','jeu','ven','sam'],out=[],t0=parisParts(now).ds,p0=t0.split('-').map(Number);
    for(var i=0;i<=hor;i++){
      var d=new Date(Date.UTC(p0[0],p0[1]-1,p0[2]+i)),ds=d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
      String((A.exceptions&&A.exceptions[ds]!==undefined)?(A.exceptions[ds]==='ferme'?'':A.exceptions[ds]):((A.dispo||{})[keys[d.getUTCDay()]]||'')).split(',').forEach(function(w){
        var m=w.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);if(!m)return;
        var a=parisTs(ds,('0'+m[1]).slice(-2)+':'+m[2]),b=parisTs(ds,('0'+m[3]).slice(-2)+':'+m[4]);
        for(var t=a;t+dur*60000<=b;t+=pas*60000){
          var e=t+dur*60000;if(t<now+pre)continue;
          if(busy.some(function(x){return t<x[1]&&e>x[0]}))continue;
          if(booked.some(function(x){return t<x[1]&&e>x[0]}))continue;
          var pp=parisParts(t);out.push({date:pp.ds,hm:pp.hm,ts:t,end:e,dur:dur});

  });
}

function eToValidate(leadId,d,s,paid){

function eBook(){
  var s=ES.slot;if(!s||ES.busy)return;ES.busy=true;ES.err='';eRender(true);
  var key=s.date+'_'+s.hm.replace(':',''),pay=OFFERT?'':String(F.paiementLien||'').trim();
  db.ref('acquisition/appels/'+key).transaction(function(c){
    var stale=c&&c.pending&&(Date.now()-Date.parse(c.at||0)>1800000); // retenue non payée depuis plus de 30 min : le créneau est libéré
    return (c&&!stale)?undefined:{leadId:ES.leadId,dur:s.dur,at:new Date().toISOString(),pending:!!pay};
  }).then(function(r){
    if(!r.committed){ES.busy=false;ES.slot=null;ES.err='Ce créneau vient d\'être pris. Choisis-en un autre.';eLoadSlots();return}
    var now=new Date().toISOString();
    if(pay){
      // Paiement d'abord : on retient le créneau mais on ne l'enregistre PAS comme rendez-vous (ni notification, ni e-mail) avant le retour de Stripe
      try{localStorage.setItem('sfm_tunnel_lead',JSON.stringify({id:ES.leadId,f:FID,at:Date.now(),appel:1}))}catch(e){}
      return db.ref('acquisition/leads/'+ES.leadId).update({status:'paiement_ouvert',paiement:'attente',paiementMontant:F.paiementPrix||'',rdvAttente:{date:s.date,hm:s.hm,dur:s.dur,ts:new Date(s.ts).toISOString()},updatedAt:now}).then(function(){
        location.href=pay+(pay.indexOf('?')<0?'?':'&')+'prefilled_email='+encodeURIComponent(ES.email)+'&client_reference_id='+encodeURIComponent(ES.leadId)});
    }
    return db.ref('acquisition/leads/'+ES.leadId).update({status:'rdv',rdvDate:s.date,rdvHeure:s.hm,rdvDuree:s.dur,rdvTs:new Date(s.ts).toISOString(),vu:false,updatedAt:now,offert:OFFERT?true:false}).then(function(){
      ES.busy=false;ES.step='merci';ES.booked=true;clearTimeout(ES.leadTimer);pxTrack('Schedule',{content_name:F.nom||FID},'sched_'+ES.leadId);eRender();window.scrollTo(0,0);
      eToValidate(ES.leadId,{nom:ES.nom,email:ES.email,telephone:ES.tel,objectif:ES.objectif},s,false);
      var lid=ES.leadId;
      return eMeet(lid,s).then(function(l){ES.meet=l||'';eVisioShow();
        return tMail('rdv',{leadId:lid,nom:ES.nom,email:ES.email,tel:ES.tel,date_rdv:eLongDate(s.date,s.hm),heure_rdv:s.hm.replace(':','h'),lien_agenda:eGcal(),lien_visio:ES.meet})})});
  }).catch(function(){ES.busy=false;ES.err='Un souci de connexion est survenu. Réessaie dans un instant.';eRender(true)});
}
