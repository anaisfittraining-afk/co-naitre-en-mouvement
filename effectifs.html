<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3F5D46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Effectifs">
<title>📊 Effectifs co-NAÎTRE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233F5D46'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='%23F7F1E6'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233F5D46'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='%23F7F1E6'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
/* Même identité visuelle que reservation.html / Épanouissement — un seul univers cohérent. */
:root {
  --green: #3F5D46;
  --green-light: #6F8F6C;
  --rose: #B96A46;
  --gold: #D97A52;
  --bg: #F7F1E6;
  --card: #ffffff;
  --border: #E2DCC8;
  --text: #26312A;
  --muted: #66735F;
  --chip: #E7EEE1;
  --carte-bg: #FBEEE7;
  --carte-fg: #8A4A2E;
  --warn-bg: #fffaf0;
  --warn-fg: #975a16;
  --warn-border: #fbd38d;
  --shadow: 0 1px 2px rgba(38,49,42,.05), 0 8px 20px rgba(38,49,42,.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--text); font-family: 'Karla', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
h1, h2, h3 { font-family: 'Fraunces', serif; font-optical-sizing: auto; }
body { padding-bottom: 40px; }

.site-header { padding: 30px 20px 18px; text-align: center; }
.site-header h1 { font-size: clamp(21px, 5.5vw, 27px); font-weight: 600; color: var(--green); line-height: 1.2; }
.site-header p { font-size: 13px; color: var(--muted); margin-top: 6px; font-weight: 500; }

.container { max-width: 640px; margin: 0 auto; padding: 0 16px; }

/* ── Stats rapides ── */
.stats-row { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.stat-chip { flex: 1 1 auto; min-width: 100px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; text-align: center; box-shadow: var(--shadow); }
.stat-chip .num { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; color: var(--green); }
.stat-chip .lbl { font-size: 10.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .3px; margin-top: 2px; }

/* ── Onglets À venir / Passées ── */
.tabs { display: flex; gap: 8px; background: var(--chip); border-radius: 14px; padding: 4px; margin-bottom: 18px; }
.tab-btn { flex: 1; padding: 10px 8px; border: none; background: transparent; border-radius: 11px; font-family: 'Karla', sans-serif; font-size: 13.5px; font-weight: 700; color: var(--muted); cursor: pointer; }
.tab-btn.active { background: var(--card); color: var(--green); box-shadow: 0 1px 3px rgba(38,49,42,.12); }

/* ── Cartes séance ── */
.slot-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
.slot-card.complet { border-color: var(--warn-border); }
.slot-card.passee { opacity: .78; }
.slot-head { padding: 14px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.slot-head:active { background: var(--chip); }
.slot-info { flex: 1; min-width: 0; }
.slot-date { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 600; color: var(--text); }
.slot-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.slot-type-badge { display: inline-block; font-size: 10.5px; font-weight: 700; color: var(--muted); background: var(--chip); border-radius: 8px; padding: 2px 7px; margin-left: 6px; vertical-align: middle; }
.slot-occ { flex-shrink: 0; text-align: right; }
.slot-occ .n { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; color: var(--green); }
.slot-occ.complet .n { color: var(--warn-fg); }
.slot-occ .cap { font-size: 10.5px; color: var(--muted); font-weight: 600; }
.chevron { font-size: 11px; color: var(--muted); transition: transform .2s; flex-shrink: 0; }
.slot-card.open .chevron { transform: rotate(180deg); }
.slot-body { display: none; padding: 0 16px 16px; }
.slot-card.open .slot-body { display: block; }
.attendee-group { margin-bottom: 12px; }
.attendee-group:last-child { margin-bottom: 0; }
.attendee-group-lbl { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; margin-bottom: 6px; }
.attendee-group-lbl.ab { color: var(--carte-fg); }
.attendee-group-lbl.ca { color: var(--green); }
.attendee-group-lbl.es { color: var(--green); }
.presence-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.presence-summary { font-size: 12px; font-weight: 700; color: var(--green); }
.presence-toggle-all { font-size: 11.5px; font-weight: 700; color: var(--green); background: var(--chip); border: none; border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.attendee-rows { display: flex; flex-direction: column; gap: 5px; }
.attendee-row { display: flex; align-items: center; gap: 9px; font-size: 13px; padding: 7px 10px; border-radius: 9px; background: var(--chip); cursor: pointer; user-select: none; -webkit-user-select: none; }
.attendee-row.ab { background: var(--carte-bg); }
.attendee-row.present { background: var(--green); color: #fff; }
.attendee-row.ab.present { background: var(--green); }
.attendee-check { width: 19px; height: 19px; border-radius: 6px; border: 1.5px solid var(--border); background: var(--card); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.attendee-row.present .attendee-check { background: #fff; color: var(--green); border-color: #fff; }
.attendee-name { flex: 1; }
.attendee-tag { font-size: 10.5px; opacity: .75; font-weight: 600; }
.empty-note { font-size: 12.5px; color: var(--muted); }
.abonnee-count-note { font-size: 12px; color: var(--carte-fg); background: var(--carte-bg); border-radius: 8px; padding: 8px 10px; line-height: 1.5; }

.empty-state { text-align: center; padding: 50px 20px; color: var(--muted); }
.empty-state .icon { font-size: 34px; margin-bottom: 10px; }
.empty-state p { font-size: 13.5px; line-height: 1.6; }

.loading-note { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13.5px; }

.home-hint { font-size: 11.5px; color: var(--muted); text-align: center; margin: 22px auto 0; max-width: 480px; line-height: 1.6; }
</style>
</head>
<body>

<div class="site-header">
  <h1>📊 Effectifs</h1>
  <p>co-NAÎTRE en mouvement — qui est inscrite, séance par séance</p>
</div>

<div class="container">
  <div class="stats-row" id="statsRow"></div>
  <div class="tabs">
    <button class="tab-btn active" id="tabVenir" onclick="setTab('venir')">À venir</button>
    <button class="tab-btn" id="tabPassees" onclick="setTab('passees')">Passées</button>
  </div>
  <div id="listContent"><div class="loading-note">Chargement de l'agenda…</div></div>
  <p class="home-hint">💡 Ajoute cette page à ton écran d'accueil (Partager → Sur l'écran d'accueil) pour l'ouvrir comme une appli, en un tap.</p>
</div>

<script>
// ── Même base Firebase que reservation.html / tableau de bord. Écrit uniquement dans
// reservations/creneaux/<id>/presence (cases à cocher de présence) — ne touche à rien d'autre. ──
var RES_FIREBASE_CONFIG = {
  apiKey: "AIzaSyC9BmsyRf2MY7qxRO7bL1wRhkJuig0IcLQ",
  authDomain: "cooperation-familiale.firebaseapp.com",
  databaseURL: "https://cooperation-familiale-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "cooperation-familiale"
};
var db = null;
try {
  if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(RES_FIREBASE_CONFIG);
  db = firebase.database();
} catch (e) { /* pas de connexion — l'écran de chargement reste affiché */ }

var CRENEAUX = {};
var ACTIVE_TAB = 'venir';
var OPEN_IDS = {}; // ids de créneaux actuellement dépliés, pour survivre aux re-rendus live

function todayISO() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmtDateFriendly(dateStr) {
  var parts = dateStr.split('-').map(Number);
  var d = new Date(parts[0], parts[1] - 1, parts[2]);
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var diffDays = Math.round((d - today) / 86400000);
  if (diffDays === 0) return "Aujourd'hui";
  if (diffDays === 1) return 'Demain';
  if (diffDays === -1) return 'Hier';
  var jours = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  var label = jours[d.getDay()] + ' ' + parts[2] + '/' + String(parts[1]).padStart(2, '0');
  return label.charAt(0).toUpperCase() + label.slice(1);
}
function resaCapaciteEffective(slot) {
  if (slot.type === 'en_ligne') return Infinity;
  return slot.capacite != null ? slot.capacite : 20;
}
function resaOccupancy(slot) {
  return (slot.abonnementCount || 0) + Object.keys(slot.abonnementChoix || {}).length + Object.keys(slot.carteBookings || {}).length + Object.keys(slot.essaiBookings || {}).length;
}

function setTab(tab) {
  ACTIVE_TAB = tab;
  document.getElementById('tabVenir').classList.toggle('active', tab === 'venir');
  document.getElementById('tabPassees').classList.toggle('active', tab === 'passees');
  render();
}

function toggleSlot(id) {
  OPEN_IDS[id] = !OPEN_IDS[id];
  var card = document.getElementById('slotcard-' + id);
  if (card) card.classList.toggle('open', !!OPEN_IDS[id]);
}

// Coche/décoche la présence d'UNE personne sur un créneau (écriture directe sur Firebase, pas
// d'authentification — même base que reservation.html / le tableau de bord). La clé combine le
// groupe et le code/id pour rester unique même si un même code apparaissait par hasard dans deux
// groupes différents (ex. 'carte-abc123', 'choix-abc123', 'essai-e1').
function togglePresence(slotId, key) {
  if (!db) return;
  var slot = CRENEAUX[slotId] || {};
  var presence = slot.presence || {};
  var next = !presence[key];
  db.ref('reservations/creneaux/' + slotId + '/presence/' + key).set(next ? true : null).catch(function() {});
}
// Coche (ou décoche, si déjà toutes cochées) toutes les persones nommées d'un créneau en un tap —
// pratique quand tout le monde annoncé est bien là. Ne concerne que les inscriptions nominatives
// (Choix / Carte / Essai) : les abonnées d'office ne sont pas suivies ici, voir attendeesHtml.
function toggleAllPresence(slotId) {
  if (!db) return;
  var slot = CRENEAUX[slotId] || {};
  var keys = [];
  Object.keys(slot.abonnementChoix || {}).forEach(function(c) { keys.push('choix-' + c); });
  Object.keys(slot.carteBookings || {}).forEach(function(c) { keys.push('carte-' + c); });
  Object.keys(slot.essaiBookings || {}).forEach(function(id) { keys.push('essai-' + id); });
  if (!keys.length) return;
  var presence = slot.presence || {};
  var allPresent = keys.every(function(k) { return !!presence[k]; });
  var updates = {};
  keys.forEach(function(k) { updates['reservations/creneaux/' + slotId + '/presence/' + k] = allPresent ? null : true; });
  db.ref().update(updates).catch(function() {});
}
function attendeeRowHtml(slotId, key, name, tag, groupClass, present) {
  return '<div class="attendee-row ' + groupClass + (present ? ' present' : '') + '" onclick="togglePresence(' + JSON.stringify(slotId) + ',' + JSON.stringify(key) + ')">' +
    '<span class="attendee-check">' + (present ? '✓' : '') + '</span>' +
    '<span class="attendee-name">' + esc(name) + '</span>' +
    (tag ? '<span class="attendee-tag">' + esc(tag) + '</span>' : '') +
    '</div>';
}
function attendeesHtml(s) {
  var out = '';
  var choixBookings = s.abonnementChoix || {};
  var choixCodes = Object.keys(choixBookings);
  var carteBookings = s.carteBookings || {};
  var carteCodes = Object.keys(carteBookings);
  var essaiBookings = s.essaiBookings || {};
  var essaiIds = Object.keys(essaiBookings);
  var abonnementCount = s.abonnementCount || 0;
  var presence = s.presence || {};

  var totalNominatif = choixCodes.length + carteCodes.length + essaiIds.length;
  if (totalNominatif) {
    var presentCount = choixCodes.filter(function(c) { return presence['choix-' + c]; }).length +
      carteCodes.filter(function(c) { return presence['carte-' + c]; }).length +
      essaiIds.filter(function(id) { return presence['essai-' + id]; }).length;
    out += '<div class="presence-head"><span class="presence-summary">✅ ' + presentCount + ' / ' + totalNominatif + ' présente' + (totalNominatif > 1 ? 's' : '') + '</span>' +
      '<button class="presence-toggle-all" onclick="event.stopPropagation();toggleAllPresence(' + JSON.stringify(s.id) + ')">Tout cocher / décocher</button></div>';
  }

  if (abonnementCount > 0) {
    out += '<div class="attendee-group"><div class="abonnee-count-note">🔁 ' + abonnementCount + ' abonnée' + (abonnementCount > 1 ? 's' : '') + " d'office (Pass) — présence non cochable ici : la liste des noms reste uniquement sur ton ordinateur (tableau de bord), par confidentialité." + '</div></div>';
  }
  if (choixCodes.length) {
    out += '<div class="attendee-group"><div class="attendee-group-lbl ab">🗓️ Choix (' + choixCodes.length + ')</div><div class="attendee-rows">' +
      choixCodes.map(function(c) { var b = choixBookings[c] || {}; return attendeeRowHtml(s.id, 'choix-' + c, b.nom || 'Abonnée', b.provisional ? 'provisoire' : '', 'ab', !!presence['choix-' + c]); }).join('') + '</div></div>';
  }
  if (carteCodes.length) {
    out += '<div class="attendee-group"><div class="attendee-group-lbl ca">🎟️ Carte (' + carteCodes.length + ')</div><div class="attendee-rows">' +
      carteCodes.map(function(c) { var b = carteBookings[c] || {}; return attendeeRowHtml(s.id, 'carte-' + c, b.nom || 'Cliente', '', 'ca', !!presence['carte-' + c]); }).join('') + '</div></div>';
  }
  if (essaiIds.length) {
    out += '<div class="attendee-group"><div class="attendee-group-lbl es">🌱 Essai (' + essaiIds.length + ')</div><div class="attendee-rows">' +
      essaiIds.map(function(id) { var b = essaiBookings[id] || {}; return attendeeRowHtml(s.id, 'essai-' + id, b.nom || "Séance d'essai", '', 'es', !!presence['essai-' + id]); }).join('') + '</div></div>';
  }
  if (!out) out = '<p class="empty-note">Aucune inscription pour l\'instant.</p>';
  return out;
}

function slotCardHtml(s, passee) {
  var capacite = resaCapaciteEffective(s);
  var illimite = !isFinite(capacite);
  var occ = resaOccupancy(s);
  var complet = !illimite && occ >= capacite;
  var isOpen = !!OPEN_IDS[s.id];
  var out = '<div class="slot-card' + (complet ? ' complet' : '') + (passee ? ' passee' : '') + (isOpen ? ' open' : '') + '" id="slotcard-' + s.id + '">';
  out += '<div class="slot-head" onclick="toggleSlot(' + JSON.stringify(s.id) + ')">';
  out += '<div class="slot-info"><div class="slot-date">' + esc(fmtDateFriendly(s.date)) + ' <span class="slot-type-badge">' + (s.type === 'presentiel' ? 'Présentiel' : 'En ligne') + '</span></div>';
  out += '<div class="slot-sub">' + esc(s.heure) + (s.duree ? ' · ' + s.duree + ' min' : '') + '</div></div>';
  out += '<div class="slot-occ' + (complet ? ' complet' : '') + '"><div class="n">' + occ + (illimite ? '' : ' / ' + capacite) + '</div><div class="cap">' + (illimite ? '♾️ illimité' : (complet ? 'complet' : 'inscrites')) + '</div></div>';
  out += '<div class="chevron">▾</div>';
  out += '</div>';
  out += '<div class="slot-body">' + attendeesHtml(s) + '</div>';
  out += '</div>';
  return out;
}

function render() {
  var listEl = document.getElementById('listContent');
  var statsEl = document.getElementById('statsRow');
  var today = todayISO();
  var all = Object.keys(CRENEAUX).map(function(id) { return Object.assign({ id: id }, CRENEAUX[id]); }).filter(function(s) { return s.date; });

  var upcoming = all.filter(function(s) { return s.date >= today; }).sort(function(a, b) { return (a.date + a.heure).localeCompare(b.date + b.heure); });
  var past = all.filter(function(s) { return s.date < today; }).sort(function(a, b) { return (b.date + b.heure).localeCompare(a.date + a.heure); });

  var totalInscritsAVenir = upcoming.reduce(function(sum, s) { return sum + resaOccupancy(s); }, 0);
  var completCount = upcoming.filter(function(s) { var cap = resaCapaciteEffective(s); return isFinite(cap) && resaOccupancy(s) >= cap; }).length;
  statsEl.innerHTML =
    '<div class="stat-chip"><div class="num">' + upcoming.length + '</div><div class="lbl">Séances à venir</div></div>' +
    '<div class="stat-chip"><div class="num">' + totalInscritsAVenir + '</div><div class="lbl">Inscriptions</div></div>' +
    '<div class="stat-chip"><div class="num">' + completCount + '</div><div class="lbl">Complètes</div></div>';

  var list = ACTIVE_TAB === 'venir' ? upcoming : past;
  if (!list.length) {
    listEl.innerHTML = '<div class="empty-state"><div class="icon">🗓️</div><p>' +
      (ACTIVE_TAB === 'venir' ? 'Aucune séance à venir pour l\'instant.' : 'Aucune séance passée enregistrée.') + '</p></div>';
    return;
  }
  listEl.innerHTML = list.map(function(s) { return slotCardHtml(s, ACTIVE_TAB === 'passees'); }).join('');
}

if (db) {
  db.ref('reservations/creneaux').on('value', function(snap) {
    CRENEAUX = snap.val() || {};
    render();
  });
} else {
  document.getElementById('listContent').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>Connexion indisponible pour l\'instant — vérifie ta connexion internet et réessaie.</p></div>';
}
</script>
</body>
</html>
