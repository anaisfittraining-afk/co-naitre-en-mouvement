<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Boutique co-NAÎTRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Karla:wght@400;500;600;700&display=swap">
<style>
:root{--green:#3F5D46;--green-dk:#2C4432;--rose:#B96A46;--bg:#F7F1E6;--card:#fff;--border:#E2DCC8;--text:#26312A;--muted:#66735F;--chip:#E7EEE1;--warn:#FFF6E5;--warn-b:#F0D9A6;--err:#A4302A;--shadow:0 1px 2px rgba(38,49,42,.05),0 8px 20px rgba(38,49,42,.07)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Karla',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:16px;min-height:100vh;padding-bottom:96px}
body.embed{padding-bottom:32px}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:500;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h1{font-size:28px;color:var(--green-dk)}
.intro{color:var(--muted);margin:-4px 0 16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pc{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);text-align:left;padding:0;display:flex;flex-direction:column}
.pc .ph{aspect-ratio:1/1;background:#EFE8D6;display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden}
.pc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pc .in{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pc .nm{font-weight:600;line-height:1.25}
.pc .pr{color:var(--green-dk);font-weight:700}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--green-dk);align-self:flex-start}
.badge.pre{background:#F3E6C0;color:#7A5A12}.badge.ko{background:#F6DEDA;color:var(--err)}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;background:var(--green);color:#fff;border:none;border-radius:12px;padding:14px 18px;font-weight:700;font-size:16px}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--green-dk);border:1.5px solid var(--border);margin-top:8px}
.btn.rose{background:var(--rose)}
.link{background:none;border:none;color:var(--green-dk);font-weight:700;text-decoration:underline;padding:6px 0}
.back{background:none;border:none;color:var(--muted);font-weight:700;padding:6px 0;margin-bottom:6px}
.gal{position:relative;border-radius:16px;overflow:hidden;background:#EFE8D6;aspect-ratio:1/1;margin-bottom:12px}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.88);font-size:20px;box-shadow:var(--shadow)}
.gal .nav.l{left:8px}.gal .nav.r{right:8px}
.dots{display:flex;gap:6px;justify-content:center;margin:-4px 0 12px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--border)}.dots i.on{background:var(--green)}
.pname{font-size:26px;line-height:1.2;margin-bottom:4px}
.pprice{font-size:22px;font-weight:700;color:var(--green-dk);margin-bottom:8px}
.desc{white-space:pre-wrap;margin:10px 0 14px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--border);border-radius:12px;background:#fff}
.qty button{width:40px;height:40px;border:none;background:none;font-size:20px;font-weight:700}
.qty span{min-width:30px;text-align:center;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.line:first-child{border-top:0}
.line .th{width:64px;height:64px;border-radius:12px;background:#EFE8D6;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:26px}
.line .th img{width:100%;height:100%;object-fit:cover}
.tot{display:flex;justify-content:space-between;padding:4px 0}
.tot.big{font-weight:700;font-size:19px;border-top:1px solid var(--border);margin-top:6px;padding-top:10px}
label.f{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
.inp{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;background:#fff;font-size:16px}
.note{background:var(--warn);border:1.5px solid var(--warn-b);border-radius:14px;padding:12px 14px;font-size:14.5px;margin:12px 0}
.err{color:var(--err);font-weight:700;margin:10px 0;display:none}.err.on{display:block}
.empty{text-align:center;padding:42px 18px}
.empty .em{font-size:52px;margin-bottom:6px}
.bar{height:10px;border-radius:999px;background:var(--chip);overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--rose);border-radius:999px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--green-dk);color:#fff;border:none;border-radius:999px;padding:13px 20px;font-weight:700;box-shadow:0 8px 24px rgba(38,49,42,.3);display:none}
.fab.on{display:block}
.fab b{background:var(--rose);border-radius:999px;padding:1px 9px;margin-left:8px}
.muted{color:var(--muted)}.small{font-size:13.5px}
.ok{text-align:center}.ok .em{font-size:52px}
@media(prefers-reduced-motion:no-preference){.pc{transition:transform .15s}.pc:active{transform:scale(.98)}}
.banner{display:block;width:100%;height:auto;border-radius:16px;margin:0 0 12px}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"><div class="empty"><div class="em">🛍️</div><p class="muted">Chargement de la boutique…</p></div></div>
<button class="fab" id="fab" onclick="go('panier')" aria-label="Voir mon panier"></button>
<script>
(function () {
  var FN = 'https://europe-west1-cooperation-familiale.cloudfunctions.net/';
  var Q = new URLSearchParams(location.search), EMBED = Q.get('embed') === '1';
  if (EMBED) document.body.classList.add('embed');
  var CK = 'sfm_boutique_cart_v1';
  var S = { view: 'list', cat: null, cfg: {}, prods: [], cur: null, img: 0, qty: 1, cart: [], err: '', busy: false, form: { nom: '', email: '', tel: '' }, merci: null };
  var TYPE = { expedie: 'Livré chez toi', main: 'Remise en main propre', numerique: 'Produit numérique' };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function eur(c) { c = (parseInt(c, 10) || 0) / 100; return (c % 1 ? c.toFixed(2) : String(c)).replace('.', ',') + ' €'; }
  function load() { try { var a = JSON.parse(localStorage.getItem(CK) || '[]'); S.cart = Array.isArray(a) ? a.filter(function (x) { return x && x.id && x.qty > 0; }) : []; } catch (e) { S.cart = []; } try { var f = JSON.parse(localStorage.getItem(CK + '_f') || '{}'); S.form = { nom: f.nom || '', email: f.email || '', tel: f.tel || '' }; } catch (e) { } }
  function save() { try { localStorage.setItem(CK, JSON.stringify(S.cart)); } catch (e) { } }
  function saveForm() { try { localStorage.setItem(CK + '_f', JSON.stringify(S.form)); } catch (e) { } }
  function nbCart() { return S.cart.reduce(function (n, l) { return n + l.qty; }, 0); }
  function prod(id) { for (var i = 0; i < S.prods.length; i++) if (S.prods[i].id === id) return S.prods[i]; return null; }
  function totals() {
    var sous = 0, exp = false;
    S.cart.forEach(function (l) { var p = prod(l.id) || l; sous += (p.prix || 0) * l.qty; if ((p.type || l.type) === 'expedie') exp = true; });
    var fr = S.cfg.francoDes || 0, port = exp && !(fr > 0 && sous >= fr) ? (S.cfg.fraisPort || 0) : 0;
    return { sous: sous, exp: exp, port: port, total: sous + port };
  }
  function api(name, opt) { return fetch(FN + name, opt).then(function (r) { return r.json(); }); }
  function post(name, body) { return api(name, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
  function html(h) { $('app').innerHTML = h; $('fab').className = 'fab' + (nbCart() && (S.view === 'list' || S.view === 'produit') ? ' on' : ''); $('fab').innerHTML = '🛒 Mon panier<b>' + nbCart() + '</b>'; if (!S._keep) window.scrollTo(0, 0); S._keep = false; }
  window.go = function (v, id) {
    S.err = ''; S.view = v;
    if (v === 'produit') { S.qty = 1; S.img = 0; S.cur = null; render(); api('boutiqueCatalogue?id=' + encodeURIComponent(id)).then(function (r) { if (r && r.ok) { S.cur = r.produit; } else { S.view = 'list'; } render(); }).catch(function () { S.view = 'list'; S.err = 'Connexion indisponible.'; render(); }); return; }
    render();
  };

  function banner() { return '<img class="banner" alt="Boutique co-NAÎTRE" src="' + BANNER + '">'; }
  function head(title) { return '<div class="top"><h1>' + esc(title) + '</h1></div>'; }
  function enConstruction() { return '<div class="card empty"><div class="em">🚧</div><h2>Boutique en cours de création</h2><p class="muted" style="margin-top:6px">Les premiers produits arrivent très bientôt. Reviens vite !</p></div>'; }
  function vList() {
    if (S.err && !S.prods.length) return head('Boutique co-NAÎTRE') + '<div class="card empty"><div class="em">📡</div><p class="muted">' + esc(S.err) + '</p><button class="btn ghost" onclick="init()">Réessayer</button></div>';
    if (S.cfg.actif === false || !S.prods.length) return banner() + enConstruction();
    var h = banner() + (S.cfg.intro ? '<p class="intro">' + esc(S.cfg.intro) + '</p>' : '') + '<div class="grid">';
    S.prods.forEach(function (p) {
      var b = p.epuise && !p.precommande ? '<span class="badge ko">Épuisé</span>' : p.precommande ? '<span class="badge pre">Précommande' + (p.minimum ? ' · ' + p.reservees + '/' + p.minimum : '') + '</span>' : '<span class="badge">' + TYPE[p.type] + '</span>';
      h += '<button class="pc" onclick="go(\'produit\',\'' + esc(p.id) + '\')"><div class="ph">' + (p.thumb ? '<img alt="" loading="lazy" src="' + esc(p.thumb) + '">' : '🎁') + '</div><div class="in"><span class="nm">' + esc(p.nom) + '</span><span class="pr">' + eur(p.prix) + '</span>' + b + '</div></button>';
    });
    return h + '</div>' + (S.err ? '<div class="err on">' + esc(S.err) + '</div>' : '');
  }
  function gallery(p) {
    var ph = p.photos || []; if (!ph.length) return '<div class="gal" style="display:flex;align-items:center;justify-content:center;font-size:64px">🎁</div>';
    var h = '<div class="gal"><img alt="' + esc(p.nom) + ' — photo ' + (S.img + 1) + '" src="' + esc(ph[S.img]) + '">';
    if (ph.length > 1) h += '<button class="nav l" onclick="img(-1)" aria-label="Photo précédente">‹</button><button class="nav r" onclick="img(1)" aria-label="Photo suivante">›</button>';
    h += '</div>';
    if (ph.length > 1) h += '<div class="dots">' + ph.map(function (_, i) { return '<i class="' + (i === S.img ? 'on' : '') + '"></i>'; }).join('') + '</div>';
    return h;
  }
  window.img = function (d) { var n = (S.cur.photos || []).length; S.img = (S.img + d + n) % n; S._keep = true; render(); };
  window.qtyChg = function (d) { S.qty = Math.max(1, Math.min(20, S.qty + d)); S._keep = true; render(); };
  function vProduit() {
    var p = S.cur; var h = '<button class="back" onclick="go(\'list\')">‹ La boutique</button>';
    if (!p) return h + '<div class="card empty"><p class="muted">Chargement…</p></div>';
    h += gallery(p) + '<h2 class="pname">' + esc(p.nom) + '</h2><div class="pprice">' + eur(p.prix) + '</div>';
    h += p.precommande ? '<span class="badge pre">Précommande sans paiement</span>' : '<span class="badge">' + TYPE[p.type] + '</span>';
    if (p.desc) h += '<p class="desc">' + esc(p.desc) + '</p>';
    if (p.precommande) {
      var pc = p.minimum ? Math.min(100, Math.round(p.reservees * 100 / p.minimum)) : 0;
      h += '<div class="card"><b>Ce produit est lancé à partir de ' + (p.minimum || 'quelques') + ' réservations.</b>' + (p.minimum ? '<div class="bar" role="progressbar" aria-valuenow="' + p.reservees + '" aria-valuemax="' + p.minimum + '"><i style="width:' + pc + '%"></i></div><div class="small muted">' + p.reservees + ' réservation' + (p.reservees > 1 ? 's' : '') + ' sur ' + p.minimum + '</div>' : '')
        + (p.precoInfo ? '<p class="small" style="margin-top:8px">' + esc(p.precoInfo) + '</p>' : '')
        + '<p class="small muted" style="margin-top:8px">Tu ne paies rien maintenant. Quand le minimum est atteint, Anaïs t\'envoie ton lien de paiement personnel.</p></div>'
        + '<div class="card"><h3 style="margin-bottom:4px">Je précommande</h3>' + fields(true) + '<div class="row" style="margin:12px 0 4px"><span class="small"><b>Quantité</b></span><div class="qty"><button onclick="qtyChg(-1)" aria-label="Moins">−</button><span>' + S.qty + '</span><button onclick="qtyChg(1)" aria-label="Plus">+</button></div></div><div class="err' + (S.err ? ' on' : '') + '">' + esc(S.err) + '</div><button class="btn rose" onclick="precommander()"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Envoi…' : 'Réserver sans payer') + '</button></div>';
      return h;
    }
    if (p.epuise) return h + '<div class="note">Ce produit est momentanément épuisé.</div>';
    h += '<div class="row" style="margin:6px 0 14px"><span><b>Quantité</b></span><div class="qty"><button onclick="qtyChg(-1)" aria-label="Moins">−</button><span>' + S.qty + '</span><button onclick="qtyChg(1)" aria-label="Plus">+</button></div></div>';
    return h + '<button class="btn" onclick="addCart()">Ajouter au panier · ' + eur(p.prix * S.qty) + '</button>';
  }
  window.addCart = function () {
    var p = S.cur; if (!p) return;
    var l = null; S.cart.forEach(function (x) { if (x.id === p.id) l = x; });
    if (l) l.qty = Math.min(20, l.qty + S.qty); else S.cart.push({ id: p.id, qty: S.qty });
    // on garde aussi la fiche dans la liste pour les prix / vignettes du panier
    save(); S.view = 'panier'; render();
  };
  window.cartQty = function (id, d) { S.cart.forEach(function (l) { if (l.id === id) l.qty = Math.max(0, Math.min(20, l.qty + d)); }); S.cart = S.cart.filter(function (l) { return l.qty > 0; }); save(); S._keep = true; render(); };
  function vPanier() {
    var h = '<button class="back" onclick="go(\'list\')">‹ Continuer mes achats</button>' + head('Mon panier');
    var lines = S.cart.filter(function (l) { return prod(l.id); });
    if (!lines.length) return h + '<div class="card empty"><div class="em">🛒</div><p class="muted">Ton panier est vide.</p><button class="btn ghost" onclick="go(\'list\')">Voir la boutique</button></div>';
    var t = totals(); h += '<div class="card">';
    lines.forEach(function (l) {
      var p = prod(l.id);
      h += '<div class="line"><div class="th">' + (p.thumb ? '<img alt="" src="' + esc(p.thumb) + '">' : '🎁') + '</div><div><div style="font-weight:600">' + esc(p.nom) + '</div><div class="small muted">' + eur(p.prix) + ' · ' + TYPE[p.type] + '</div><button class="link small" onclick="cartQty(\'' + esc(l.id) + '\',-99)">Retirer</button></div><div class="qty"><button onclick="cartQty(\'' + esc(l.id) + '\',-1)" aria-label="Moins">−</button><span>' + l.qty + '</span><button onclick="cartQty(\'' + esc(l.id) + '\',1)" aria-label="Plus">+</button></div></div>';
    });
    h += '</div><div class="card"><div class="tot"><span>Sous-total</span><span>' + eur(t.sous) + '</span></div>';
    if (t.exp) h += '<div class="tot"><span>Frais de port</span><span>' + (t.port ? eur(t.port) : 'Offerts') + '</span></div>' + (S.cfg.francoDes && t.port ? '<div class="small muted">Port offert dès ' + eur(S.cfg.francoDes) + ' d\'achat.</div>' : '');
    h += '<div class="tot big"><span>Total</span><span>' + eur(t.total) + '</span></div></div><button class="btn" onclick="go(\'commande\')">Commander</button>';
    return h;
  }
  function fields(pre) {
    return '<label class="f" for="f-nom">Nom et prénom</label><input class="inp" id="f-nom" autocomplete="name" value="' + esc(S.form.nom) + '">'
      + '<label class="f" for="f-email">Adresse e-mail</label><input class="inp" id="f-email" type="email" autocomplete="email" value="' + esc(S.form.email) + '">'
      + '<label class="f" for="f-tel">Téléphone (facultatif)</label><input class="inp" id="f-tel" type="tel" autocomplete="tel" value="' + esc(S.form.tel) + '">';
  }
  function readForm() { var g = function (i) { var e = $(i); return e ? e.value.trim() : ''; }; if ($('f-nom')) { S.form = { nom: g('f-nom'), email: g('f-email'), tel: g('f-tel') }; saveForm(); } }
  function formErr() { if (S.form.nom.length < 2) return 'Merci d\'indiquer ton nom et prénom.'; if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.form.email)) return 'Cette adresse e-mail ne semble pas valide.'; return ''; }
  function vCommande() {
    var t = totals(), types = {}; S.cart.forEach(function (l) { var p = prod(l.id); if (p) types[p.type] = 1; });
    var h = '<button class="back" onclick="go(\'panier\')">‹ Mon panier</button>' + head('Ma commande') + '<div class="card">' + fields(false);
    if (types.expedie) h += '<div class="note">📦 <b>Livraison :</b> tu indiqueras ton adresse sur la page de paiement sécurisée.</div>';
    if (types.main) h += '<div class="note">🤝 <b>Remise en main propre :</b> ' + esc(S.cfg.retrait || 'Anaïs te contacte pour convenir de la remise.') + '</div>';
    if (types.numerique) h += '<div class="note">💾 <b>Produit numérique :</b> ton lien s\'affiche juste après le paiement.</div>';
    h += '<div class="tot big"><span>Total à payer</span><span>' + eur(t.total) + '</span></div><div class="err' + (S.err ? ' on' : '') + '">' + esc(S.err) + '</div><button class="btn" onclick="payer()"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Ouverture du paiement…' : 'Payer ' + eur(t.total)) + '</button><p class="small muted" style="text-align:center;margin-top:8px">Paiement sécurisé par Stripe</p></div>';
    return h;
  }
  var ERR = { fermee: 'La boutique est fermée pour le moment.', nom: 'Merci d\'indiquer ton nom et prénom.', email: 'Cette adresse e-mail ne semble pas valide.', vide: 'Ton panier est vide.', produit: 'Un produit de ton panier n\'est plus disponible : retire-le et réessaie.', stock: 'Stock insuffisant.', lancee: 'Les précommandes de ce produit sont terminées.', deja: 'Ta précommande est déjà enregistrée.', serveur: 'Un souci est survenu. Réessaie dans un instant.' };
  window.payer = function () {
    readForm(); var m = formErr(); if (m) { S.err = m; S._keep = true; return render(); }
    S.busy = true; S.err = ''; S._keep = true; render();
    post('boutiqueCommande', { nom: S.form.nom, email: S.form.email, tel: S.form.tel, items: S.cart.map(function (l) { return { id: l.id, qty: l.qty }; }) }).then(function (r) {
      if (r && r.ok && r.url) { try { (window.top || window).location.href = r.url; } catch (e) { location.href = r.url; } return; }
      S.busy = false; S.err = (r && r.err === 'stock') ? ('Il ne reste que ' + r.dispo + ' « ' + r.nom + ' » en stock.') : (ERR[r && r.err] || ERR.serveur); S._keep = true; render();
    }).catch(function () { S.busy = false; S.err = 'Connexion indisponible, réessaie dans un instant.'; S._keep = true; render(); });
  };
  window.precommander = function () {
    readForm(); var m = formErr(); if (m) { S.err = m; S._keep = true; return render(); }
    S.busy = true; S.err = ''; S._keep = true; render();
    post('boutiquePrecommande', { id: S.cur.id, qty: S.qty, nom: S.form.nom, email: S.form.email, tel: S.form.tel }).then(function (r) {
      S.busy = false;
      if (r && r.ok) { S.view = 'pre_ok'; S.merci = { nom: S.cur.nom, reservees: r.reservees, minimum: r.minimum }; render(); return; }
      S.err = ERR[r && r.err] || ERR.serveur; S._keep = true; render();
    }).catch(function () { S.busy = false; S.err = 'Connexion indisponible, réessaie dans un instant.'; S._keep = true; render(); });
  };
  function vPreOk() {
    var m = S.merci || {};
    return '<div class="card ok"><div class="em">🌿</div><h2>Ta précommande est enregistrée</h2><p style="margin:8px 0">Tu as réservé <b>' + esc(m.nom) + '</b>. Tu ne paies rien pour l\'instant.</p>' + (m.minimum ? '<p class="muted">' + m.reservees + ' réservation' + (m.reservees > 1 ? 's' : '') + ' sur ' + m.minimum + ' nécessaires.</p>' : '') + '<p style="margin-top:8px">Dès que le minimum est atteint, Anaïs te prévient et t\'envoie ton lien de paiement personnel.</p></div><button class="btn ghost" onclick="go(\'list\')">Retour à la boutique</button>';
  }
  function backLinks() { return '<p class="small muted" style="text-align:center;margin-top:14px">Retrouve-nous dans <a href="https://anaisfittraining-afk.github.io/Mon-epanouissement-personnel/">Mon espace co-NAÎTRE</a> ou <a href="https://anaisfittraining-afk.github.io/co-naitre-en-mouvement/reservation.html">co-NAÎTRE en mouvement</a>.</p>'; }
  function vMerci() {
    var m = S.merci;
    if (!m) return '<div class="card empty"><div class="em">⏳</div><h2>Nous vérifions ton paiement…</h2><p class="muted">Quelques secondes, ne ferme pas la page.</p></div>';
    if (m.erreur) return '<div class="card ok"><div class="em">🌿</div><h2>Merci pour ta commande !</h2><p class="muted" style="margin:8px 0">Ton paiement est bien reçu. Si le récapitulatif ne s\'affiche pas, pas d\'inquiétude : Anaïs a ta commande et te recontacte.</p></div>' + backLinks();
    var h = '<div class="card ok"><div class="em">🌿</div><h2>Merci' + (m.prenom ? ' ' + esc(m.prenom) : '') + ', ta commande est confirmée !</h2><p class="muted" style="margin-top:6px">Un reçu t\'est envoyé par e-mail par Stripe.</p></div><div class="card"><h3 style="margin-bottom:8px">Ta commande</h3>';
    m.lignes.forEach(function (l) { h += '<div class="tot"><span>' + esc(l.nom) + ' × ' + l.qty + '</span><span>' + eur(l.prix * l.qty) + '</span></div>'; });
    if (m.port) h += '<div class="tot"><span>Frais de port</span><span>' + eur(m.port) + '</span></div>';
    h += '<div class="tot big"><span>Total payé</span><span>' + eur(m.total) + '</span></div></div>';
    m.lignes.forEach(function (l) { if (l.type === 'numerique' && l.lien) h += '<a class="btn rose" style="margin-bottom:10px" href="' + esc(l.lien) + '" target="_blank" rel="noopener">💾 Ouvrir « ' + esc(l.nom) + ' »</a>'; });
    var types = {}; m.lignes.forEach(function (l) { types[l.type] = 1; });
    if (types.expedie) h += '<div class="note">📦 Ta commande sera expédiée très vite à l\'adresse indiquée lors du paiement.</div>';
    if (types.main) h += '<div class="note">🤝 Anaïs te contacte pour convenir de la remise en main propre.</div>';
    return h + backLinks();
  }
  function vAnnule() { return '<div class="card ok"><div class="em">🌿</div><h2>Paiement annulé</h2><p class="muted" style="margin:8px 0">Aucun montant n\'a été débité. Ton panier est conservé.</p></div><button class="btn" onclick="go(\'panier\')">Retourner à mon panier</button>' + backLinks(); }
  function vPayerPre() {
    var m = S.merci; if (!m) return '<div class="card empty"><div class="em">⏳</div><p class="muted">Préparation de ton paiement…</p></div>';
    if (m.err) return '<div class="card ok"><div class="em">🌿</div><h2>Ce lien ne peut pas être utilisé</h2><p class="muted" style="margin:8px 0">' + esc(m.err === 'pas_encore' ? 'Le produit n\'est pas encore lancé : Anaïs t\'enverra un lien dès que ce sera le cas.' : m.err === 'payee' ? 'Cette précommande est déjà payée. Merci !' : 'Le lien est incorrect ou a expiré. Écris à Anaïs pour en recevoir un nouveau.') + '</p></div>' + backLinks();
    return '<div class="card ok"><div class="em">🌿</div><h2>Ta précommande est prête</h2><p style="margin:8px 0">' + esc(m.produit) + ' × ' + m.qty + ' · <b>' + eur(m.total) + '</b></p><a class="btn" href="' + esc(m.url) + '">Payer maintenant</a></div>';
  }
  function render() {
    var v = S.view, h;
    if (v === 'produit') h = vProduit(); else if (v === 'panier') h = vPanier(); else if (v === 'commande') h = vCommande();
    else if (v === 'pre_ok') h = vPreOk(); else if (v === 'merci') h = vMerci(); else if (v === 'annule') h = vAnnule(); else if (v === 'payerpre') h = vPayerPre(); else h = vList();
    html(h);
  }

  /* ───────── démarrage ───────── */
  function pollMerci(sid, n) {
    api('boutiqueMerci?sid=' + encodeURIComponent(sid)).then(function (r) {
      if (r && r.ok) { S.merci = r; try { localStorage.removeItem(CK); } catch (e) { } S.cart = []; render(); return; }
      if (n < 12) setTimeout(function () { pollMerci(sid, n + 1); }, 1500); else { S.merci = { erreur: true }; render(); }
    }).catch(function () { if (n < 12) setTimeout(function () { pollMerci(sid, n + 1); }, 2000); else { S.merci = { erreur: true }; render(); } });
  }
  window.init = function () {
    load();
    if (Q.get('merci') === '1' && Q.get('sid')) { S.view = 'merci'; render(); pollMerci(Q.get('sid'), 0); return; }
    if (Q.get('payer') && Q.get('t')) {
      S.view = 'payerpre'; render();
      api('boutiquePayerPrecommande?id=' + encodeURIComponent(Q.get('payer')) + '&t=' + encodeURIComponent(Q.get('t'))).then(function (r) { S.merci = r && r.ok ? r : { err: (r && r.err) || 'lien' }; render(); }).catch(function () { S.merci = { err: 'lien' }; render(); });
      return;
    }
    S.view = Q.get('annule') === '1' ? 'annule' : 'list';
    api('boutiqueCatalogue').then(function (r) {
      if (r && r.ok) { S.cfg = r.config || {}; S.prods = r.produits || []; S.err = ''; S.cart = S.cart.filter(function (l) { return prod(l.id); }); save(); }
      else S.err = 'La boutique est momentanément indisponible.';
      render();
    }).catch(function () { S.err = 'Connexion indisponible pour le moment.'; render(); });
  };
  render(); window.init();
})();
</script>
</body>
</html>
